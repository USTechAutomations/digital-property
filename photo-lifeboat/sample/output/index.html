  var data = JSON.parse(document.getElementById('data').textContent);
  var main = document.getElementById('main');
  var nav = document.getElementById('nav');
  var lb = document.getElementById('lb');

  var idx = 0;

    else { var a = el('a', '', 'Open ' + it.p.split('/').pop() + ' (your browser may not display this type)'); a.href = enc(it.p); stage.appendChild(a); }

  });
  function byDate(a, b) { var x = data.items[a].d || '9', y = data.items[b].d || '9'; return x < y ? -1 : x > y ? 1 : 0; }
  var views = {
    albums: function () {
      var w = el('div');

      if (!data.albums.length) w.appendChild(el('p', 'empty', 'This library has no albums.'));
      var g = el('div', 'grid');
      data.albums.forEach(function (al, n) {

        var cap = el('div', 'cap');

      list.sort(byDate); w.appendChild(grid(list)); return w;
    }

})();</script></body></html>
